# ==========================
# Recherche immobilière
# ==========================

search:

  city: "Brest"

  # Quartiers prioritaires rive gauche
  districts:
    # Rive gauche
    - "Liberté"
    - "Place de la Liberté"
    - "Siam"
    - "Saint-Martin"
    - "Saint-Marc"
    - "Saint-Louis"
    - "Gare"
    - "Kerbernard"
    - "Kerfautras"
    - "Jaurès"
    - "Jean Jaurès"
    - "Haut de Jaurès"
    - "Centre"
    - "Centre-ville"
    - "Port de commerce"
    - "Pilier Rouge"
    - "Place Guérin"
    - "Keruscun"
    # Rive droite
    - "Brest"
    - "Recouvrance"
    - "Quatre Moulins"

  # Prix maximum charges comprises
  max_price: 500

  # Minimum T2
  min_rooms: 2

  # Minimum une vraie chambre
  min_bedrooms: 1

  # Surface minimum (évite les faux T2 minuscules)
  min_surface: 20


# ==========================
# Type de logement
# ==========================

property:

  allowed_types:
    - "Appartement"

  exclude_keywords:

    # Colocations déguisées
    - "colocation"
    - "coloc"
    - "chambre"
    - "bail individuel"

    # Locations qui ne correspondent pas
    - "garage"
    - "box"
    - "parking seul"


# ==========================
# Performance énergétique
# ==========================

energy:

  # DPE autorisés (D est très courant à Brest, NS = Non Soumis)
  allowed_dpe:
    - "A"
    - "B"
    - "C"
    - "D"
    - "NS"


# ==========================
# Options supplémentaires
# ==========================

preferences:

  parking_bonus: true

  furnished_allowed: true

  unfurnished_allowed: true


# ==========================
# Notifications
# ==========================

notifications:

  discord:
    enabled: true

    # sera remplacé par une variable d'environnement
    webhook_env: "DISCORD_WEBHOOK"


# ==========================
# Scraping
# ==========================

scraping:

  # Intervalle entre chaque scan (en minutes)
  interval_minutes: 60

  timeout_seconds: 20

  max_pages_per_site: 5